name: Refresh CostScope Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh CostScope warehouse
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      COSTSCOPE_DATABASE_URL: ${{ secrets.COSTSCOPE_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh CostScope warehouse
        run: |
          python -m scripts.refresh_costscope
